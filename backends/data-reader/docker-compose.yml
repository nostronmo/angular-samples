services:
  postgres:
    image: postgres:16
    container_name: echarts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - echarts_data:/var/lib/postgresql/data
    env_file:
      - .env

volumes:
  echarts_data:
